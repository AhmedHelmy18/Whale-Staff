name: whale_staff
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path_provider_windows: ^2.3.0
  fl_chart: ^1.1.1
  excel: ^4.0.6
  docx_template: ^0.4.0
  intl: ^0.20.2
  file_saver: ^0.3.1
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: any
  hive_generator: any
  flutter_lints: ^6.0.0
